[project]
name = "compose-risk"
version = "0.1.0"
description = "Evals for risk that only appears when contracts are combined"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "inspect-ai>=0.3.291",
    "pydantic>=2",
    "tree-sitter-language-pack>=1.25",
]

[project.entry-points.inspect_ai]
compose_risk = "compose_risk._registry"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
files = ["src", "tests"]
strict = true
