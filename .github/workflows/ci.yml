name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2

      # Each version compiles on its own: versions and cases reuse contract names.
      - name: Exploit tests
        run: |
          for version in cases/*/*/*/; do
            ls "${version}exploit/"*.t.sol >/dev/null 2>&1 || continue
            echo "::group::${version}"
            FOUNDRY_SRC="${version}layers" FOUNDRY_TEST="${version}exploit" forge test -vv
            echo "::endgroup::"
          done

      - name: Versions form a controlled pair
        run: python3 scripts/check_versions.py
